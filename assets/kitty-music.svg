xt x="20" y="95">♫</text><text x="317" y="65">♪</text></g><style>.kitty-body{animation:dance 1.2s ease-in-out infinite}.notes{animation:notes 2s infinite}@keyframes dance{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-8px)}}@keyframes notes{50%{transform:translateY(-15px);opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>
